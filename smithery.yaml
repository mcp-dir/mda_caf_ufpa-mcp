# Smithery configuration for MDA CAF: Unidade Familiar de Produção Agrária (UFPA)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_mda_caf_ufpa

name: mda_caf_ufpa-mcp
displayName: "MDA CAF: Unidade Familiar de Produção Agrária (UFPA)"
description: >
  MDA CAF: Unidade Familiar de Produção Agrária (UFPA), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/mda_caf_ufpa-mcp
repository: https://github.com/mcp-dir/mda_caf_ufpa-mcp

tags:
  - mda_caf_ufpa
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_mda_caf_ufpa

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_mda_caf_ufpa/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
